# XY-SK120 bench supply — ESP32 Modbus-RTU/TTL bridge, D3806-pattern ESPHome.
# ESP32 is wired to the XY-SK120's TTL UART (3-wire: GND/TX/RX, no RS485 DE/RE,
# no flow control). Register map: ../lib/XY-SKxxx/XY-SKxxx.h (source of truth,
# verified on-device fw 1.39: MODEL 0x16 == 22873, 115200 8N1, slave 1).
#
# Scaling (from datasheet, confirmed by probe): V ×0.01, A ×0.001, W ×0.01,
# temp ×0.1. number writes use register_raw = value × multiply (inverse).
#
# STAGE 1 (this file): modbus mapping + stock web_server UI, to verify every
# entity against real hardware. STAGE 2: replace the default page with the
# carved DPS-150 panel (D3806 web.yaml + PanelHandler) once entities are proven.

substitutions:
  name: "xy-sk120"
  friendly_name: "XY-SK120"
  project_version: "2026.10.06"

  # -- Wiring: Seeed XIAO ESP32-C3 ------------------------------------------
  uart_tx: "GPIO3"         # ESP TX -> XY-SK120 RX
  uart_rx: "GPIO4"         # ESP RX <- XY-SK120 TX
  modbus_addr: "1"         # REG_SLAVE_ADDR factory default
  poll_ms: "500ms"         # telemetry poll (Vin + all live regs)

  # -- Setpoint UI clamps (device enforces its own limits)
  vset_max: "36.5"         # verified on-device accepts up to 36.5 V
  iset_max: "6.0"          # SK120 hard max 6A (120W; power-limit bites >20V)

  # -- Output-enable soft-start (avoids boost inrush collapsing a weak input
  # like a PD trigger). The boost stage engaging AT enable is what trips PD, so a
  # cold enable commands V_SET below Vin first (output comes up in BUCK = benign),
  # then the ramp steps up THROUGH Vin into boost gradually. Tune to your input.
  ss_step: "2"          # V per step (smaller = less per-step boost inrush)
  ss_interval: "250ms"    # time between steps
  ss_boot_drop: "2.0"      # V below Vin to enable at (keeps cold enable in buck)

  # -- Lead-acid charge engine (SET per pack before charging a real battery) --
  # Carried from dps150 charge/profiles.js (leadacid) + engine.js state machine.
  # EverStart Platinum AGM H8 — 95Ah, CCA 900, RC 160.
  cells: "6"               # 12V pack = 6 cells (24V = 12)
  capacity_ah: "95"        # pack Ah — sets taper + total-time ceiling
  charge_a: "4.0"          # bulk/CC current (A) — conservative start (C/24 on 95Ah)
  absorb_v_cell: "2.40"    # AGM absorb -> 14.4V
  float_v_cell: "2.27"     # AGM float -> 13.6V
  taper_c: "0.02"          # CV->FLOAT taper = taper_c * capacity_ah (A)
  temp_min: "-10"          # cold inhibit (C)
  temp_max: "50"           # hot abort (C)
  tempcomp_mv: "-4"        # mV/C/cell off 25C ref (negative = raise V when cold)

  # Input source power budget: caps CC current so Vout*Iout/eff stays under the
  # source (prevents a PD trigger folding/resetting under steady load). Computed
  # at worst-case voltage (absorbV). Soft-start handles the enable transient.
  source_max_w: "100"      # source claim (W)
  source_eff: "0.9"        # converter efficiency (input W = output W / eff)

  # Source voltage window (4S LiFePO4 bank). Won't start outside it; aborts the
  # charge if the source drops below src_min_v (protects the bank from over-discharge).
  src_min_v: "12.0"        # 3.0V/cell knee — LFP falls off fast below this
  src_max_v: "14.6"        # 3.65V/cell full
  src_low_dwell_s: "15"    # Vin must stay < src_min_v this long before abort (debounce load sag)

  boot_output_off: "false" # false = resume a charge that was running pre-reboot; true = always force output off on boot

packages:
  base: !include common.yaml

esp32:
  variant: esp32c3
  # C3 supports the Arduino framework (ESPHome default) — no esp-idf needed.
  # XIAO ESP32-C3 external u.FL antenna is hardware-selected (no GPIO switch,
  # unlike the C6). Switched off the C6 for WiFi stability.

# Quiet only the telemetry READ flood (sensor polls, poll-refused). Keep the
# register WRITES (modbus.number) + number state at DEBUG so the ramp is visible.
logger:
  logs:
    modbus: WARN                     # buffer/poll-refused spam
    modbus_controller: WARN          # "Poll refused by hub"
    modbus_controller.sensor: WARN   # "Sensor new state" telemetry reads
    modbus_controller.switch: WARN
    sensor: WARN                     # sensor state publishes

# Override common.yaml's include_internal: hide internal plumbing (sk_onoff raw
# bit, bridge regs sk_r06–sk_r10) from the web UI.
web_server:
  include_internal: false

# Boot policy. Engine is gated on cj_booted so the 1s tick can't act before
# this runs. boot_output_off:true = always come up output-off (safety).
# false = resume: if a charge was running (cj_run persisted), restart it from
# IDLE so preflight + soft-start re-run cleanly.
esphome:
  on_boot:
    - priority: -100          # after components/modbus are up
      then:
        - delay: 2s           # let the modbus hub establish before writing
        - if:
            condition:
              lambda: 'return ${boot_output_off};'
            then:
              - lambda: 'id(cj_run) = false; id(cj_stage) = 0; id(cj_status) = std::string("boot: output off");'
              - script.stop: softstart_on
              - switch.turn_off: sk_onoff
            else:
              - lambda: |-
                  id(cj_stage) = 0;   // restart from IDLE; engine re-runs preflight if cj_run
                  if (id(cj_run)) id(cj_status) = std::string("resuming charge after boot");
        - lambda: 'id(cj_booted) = true;'   # release the engine tick

# Kill the output before an OTA — never flash with a live charge running.
ota:
  - id: !extend ota_esphome
    on_begin:
      then:
        - lambda: 'id(cj_run) = false;'
        - script.stop: softstart_on
        - switch.turn_off: sk_onoff

time:
  - platform: sntp
    servers:
      - 10.0.2.1
      - 10.0.2.24

uart:
  id: uart_modbus
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  baud_rate: 115200        # REG_BAUDRATE_L default code 6
  # 8N1 is ESPHome default; XY-SK120 needs no parity/flow control.

modbus:
  id: modbus_bus
  uart_id: uart_modbus

modbus_controller:
  - id: sk120
    address: ${modbus_addr}
    modbus_id: modbus_bus
    update_interval: ${poll_ms}
    # Fewer ranges = fewer frames/cycle = no "Poll refused by hub" (continuous
    # polls cap at 2 pending; a range the UART can't drain in time skips a tick).
    # ESPHome groups only CONTIGUOUS defined addresses into one command, so the
    # gap regs 0x06–0x0C and 0x0F–0x10 are declared as internal bridge sensors
    # below — that makes 0x02–0x12 contiguous -> ONE FC03 read. (register_count
    # does NOT merge defined sensors across a gap; verified on-device.) V_SET/
    # I_SET (0x00–0x01) poll as their own small range; model/version skip:600.

globals:
  - id: g_target          # captured V_SET target for the soft-start ramp
    type: float
    restore_value: no
    initial_value: '0'
  - id: ss_cur            # soft-start local ramp value (NOT device readback — avoids infinite loop)
    type: float
    restore_value: no
    initial_value: '0'
  # ---- charge engine state ----
  - {id: cj_run,      type: bool,     restore_value: yes, initial_value: 'false'} # Charge on — PERSISTED for resume-after-boot
  - {id: cj_booted,   type: bool,     restore_value: no, initial_value: 'false'}  # boot policy applied -> engine may run
  - {id: cj_stage,    type: int,      restore_value: no, initial_value: '0'}      # 0 IDLE 1 CC 2 CV 3 FLOAT 4 DONE 5 FAULT
  - {id: cj_t0,       type: uint32_t, restore_value: no, initial_value: '0'}      # charge start millis
  - {id: cj_stage_t0, type: uint32_t, restore_value: no, initial_value: '0'}      # stage start millis
  - {id: cj_taper_t0, type: int32_t,  restore_value: no, initial_value: '-1'}     # taper-began millis (-1 = null)
  - {id: cj_srclow_t0,type: int32_t,  restore_value: no, initial_value: '-1'}     # source-below-min millis (-1 = null), debounce
  - {id: cj_status,   type: std::string, restore_value: no, initial_value: '""'}  # fault/status text

# Output-enable soft-start. Target <= Vin+margin -> enable at target (buck, no
# inrush). Target > Vin -> command Vin, enable, then step V_SET up to target.
script:
  - id: softstart_on
    mode: single           # ignore re-triggers while running — prevents g_target ratchet/runaway
    then:
      # Capture target once from v_target (stable), clamp to the hard ceiling.
      # Ramp floor = present Vout if already outputting (a LIVE raise, e.g. 20->28
      # while on), else Vin (buck floor for a cold enable). V_SET is NEVER written
      # straight up to the target — a boost step up collapses a weak source / trips
      # PD, which reboots the device. Every raise walks up through this ramp.
      - lambda: |-
          float tgt = id(v_target).state;
          if (tgt > ${vset_max}) tgt = ${vset_max};
          id(g_target) = tgt;
          // Cold enable: start BELOW Vin so output energizes in buck (boost
          // engaging at enable is what trips PD). Live raise: start at present Vout.
          id(ss_cur) = id(sk_onoff).state ? id(sk_vout).state
                                          : (id(sk_vin).state - ${ss_boot_drop});
          if (id(ss_cur) < 0) id(ss_cur) = 0;
      - if:
          condition:
            # ramp only when the target is more than one step above the floor.
            lambda: 'return id(g_target) <= id(ss_cur) + ${ss_step};'
          then:
            # within one step: cold buck enable, or lowering while on (buck down is
            # safe to command directly). Enable only if currently off.
            - number.set: {id: vset_dev, value: !lambda 'return id(g_target);'}
            - if:
                condition:
                  lambda: 'return !id(sk_onoff).state;'
                then:
                  - switch.turn_on: sk_onoff
          else:
            # Boost ramp from ss_cur (floor) up to target with a local counter —
            # never measured Vout or device readback. The device may be PRE-LOADED
            # with a high setpoint (user set V while OFF); enabling applies it the
            # instant ONOFF=1, so we MUST drive V_SET down to the floor and let the
            # device actually latch it (one full poll) BEFORE enabling — else it
            # boosts straight to target and trips PD / resets.
            - number.set: {id: vset_dev, value: !lambda 'return id(ss_cur);'}
            - delay: ${poll_ms}
            - number.set: {id: vset_dev, value: !lambda 'return id(ss_cur);'}
            - delay: ${ss_interval}
            - if:
                condition:
                  lambda: 'return !id(sk_onoff).state;'
                then:
                  - switch.turn_on: sk_onoff
                  # energize moment is the most PD-sensitive — settle longer here
                  - delay: ${poll_ms}
            # while re-checks the condition against the live ss_cur each pass —
            # correct for mutating state. (A templated repeat.count is re-evaluated
            # every iteration too, so deriving it from ss_cur made it count DOWN
            # while repeat's own index counted UP; they met at the midpoint and the
            # ramp stopped at (Vin+target)/2. Classic.) Monotonic += with clamp
            # guarantees termination.
            - while:
                condition:
                  lambda: 'return id(ss_cur) < id(g_target) - 0.001f;'
                then:
                  - lambda: |-
                      id(ss_cur) += ${ss_step};
                      if (id(ss_cur) > id(g_target)) id(ss_cur) = id(g_target);
                  - number.set: {id: vset_dev, value: !lambda 'return id(ss_cur);'}
                  - delay: ${ss_interval}

# ---- Telemetry (FC03 holding reads) ----------------------------------------
sensor:
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Output Voltage"
    id: sk_vout
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    filters: [multiply: 0.01]

  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Output Current"
    id: sk_iout
    register_type: holding
    address: 0x0003
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    filters: [multiply: 0.001]

  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Output Power"
    id: sk_power
    register_type: holding
    address: 0x0004
    value_type: U_WORD
    unit_of_measurement: "W"
    accuracy_decimals: 2
    device_class: power
    filters: [multiply: 0.01]

  # Rob: read Vin on a regular interval — PD-trigger source (observed 20.06 V @ 20V USB-C PD).
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Input Voltage"
    id: sk_vin
    register_type: holding
    address: 0x0005
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    filters: [multiply: 0.01]

  # Internal temp. S_WORD so sub-zero reads don't wrap. Unit tracks REG_F_C (0x13);
  # assumes device set to °C (factory). ×0.1.
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Internal Temp"
    id: sk_temp_int
    register_type: holding
    address: 0x000D
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    filters: [multiply: 0.1]

  # Rob: external NTC port (REG_T_EX). Nothing wired yet — raw 8888 (=888.8)
  # observed as the no-probe sentinel until the thermistor is connected. S_WORD.
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "External NTC Temp"
    id: sk_temp_ext
    register_type: holding
    address: 0x000E
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    filters: [multiply: 0.1]

  # --- Internal bridge regs: declared only to make 0x02–0x12 contiguous so the
  # live telemetry collapses to ONE FC03 read. Not exposed (internal: true).
  # 0x06–0x09 = AH/WH low/high, 0x0A–0x0C = output time h/m/s, 0x0F = lock,
  # 0x10 = protect. Promote any of these to a named sensor later if useful
  # (AH/WH are handy for charge coulomb/energy tracking).
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r06, internal: true, register_type: holding, address: 0x0006, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r07, internal: true, register_type: holding, address: 0x0007, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r08, internal: true, register_type: holding, address: 0x0008, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r09, internal: true, register_type: holding, address: 0x0009, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r0a, internal: true, register_type: holding, address: 0x000A, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r0b, internal: true, register_type: holding, address: 0x000B, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r0c, internal: true, register_type: holding, address: 0x000C, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r0f, internal: true, register_type: holding, address: 0x000F, value_type: U_WORD}
  - {platform: modbus_controller, modbus_controller_id: sk120, id: sk_r10, internal: true, register_type: holding, address: 0x0010, value_type: U_WORD}

  # Identity / static — own range, polled rarely.
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Model ID"
    id: sk_model
    register_type: holding
    address: 0x0016
    value_type: U_WORD
    entity_category: diagnostic
    skip_updates: 600       # expect 22873 for XY-SK120

  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Firmware Version"
    id: sk_version
    register_type: holding
    address: 0x0017
    value_type: U_WORD
    entity_category: diagnostic
    skip_updates: 600

  # Commanded power ceiling (setpoints, not measured output). Read-only.
  - platform: template
    name: "Set Wattage"
    id: set_wattage
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    update_interval: 1s
    lambda: 'return id(v_target).state * id(set_current).state;'

  # Device's actual REG_V_SET (reflects front-panel edits + device clamp),
  # decoupled from the target so readback can't corrupt the ramp.
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Device V_SET"
    id: device_vset
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    skip_updates: 3
    filters: [multiply: 0.01]
    # Mirror front-panel edits into the target, but ONLY when fully idle (output
    # off, no charge, no ramp). NOTE: the device clamps REG_V_SET to ~OVP, and
    # that clamp reads back here too — raise OVP so a full-scale target sticks,
    # otherwise this pulls Set Voltage down to the clamp.
    on_value:
      - if:
          condition:
            lambda: 'return !id(cj_run) && !id(softstart_on).is_running() && !id(sk_onoff).state && fabsf(x - id(v_target).state) > 0.05f;'
          then:
            - number.set: {id: v_target, value: !lambda 'return x;'}

# ---- Status flags (attach to the 0x02–0x12 live range by address) ----------
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "CV Mode"          # REG_CVCC 0x11: 1 = CV, 0 = CC
    id: sk_cv
    register_type: holding
    address: 0x0011
    bitmask: 1

  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Output State"     # REG_ONOFF 0x12 read mirror for the panel
    register_type: holding
    address: 0x0012
    bitmask: 1

# ---- Controls (FC06 holding writes) ----------------------------------------
switch:
  # Raw REG_ONOFF bit — internal; driven by the Output switch via soft-start.
  - platform: modbus_controller
    modbus_controller_id: sk120
    id: sk_onoff
    internal: true
    register_type: holding
    address: 0x0012
    bitmask: 1

  # User-facing output control. ON runs the soft-start; OFF kills it immediately.
  - platform: template
    name: "Output"           # SAFETY: drives live output
    id: output_sw
    lambda: 'return id(sk_onoff).state;'   # reflect actual device state
    turn_on_action:
      - script.execute: softstart_on
    turn_off_action:
      - lambda: 'id(cj_run) = false;'   # manual output-off aborts any charge
      - script.stop: softstart_on
      - switch.turn_off: sk_onoff

  # Lead-acid charge: ON starts the engine (see interval tick); OFF kills it.
  - platform: template
    name: "Charge"          # SAFETY: runs the pack charger (CC/CV/FLOAT)
    id: charge_sw
    optimistic: true
    turn_on_action:
      - lambda: 'id(cj_run) = true; id(cj_stage) = 0; id(cj_status) = std::string("starting");'
    turn_off_action:
      - lambda: 'id(cj_run) = false; id(cj_stage) = 0; id(cj_status) = std::string("");'
      - script.stop: softstart_on
      - switch.turn_off: sk_onoff

number:
  # User target voltage. The soft-start ramp READS this and never writes it, so
  # device readback/clamp can't corrupt the target. Actual register writes go to
  # vset_dev; the device's real value shows in the "Device V_SET" sensor.
  - platform: template
    name: "Set Voltage"
    id: v_target
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    min_value: 0
    max_value: ${vset_max}
    step: 0.01
    initial_value: 14.4
    on_value:
      # Mid-ramp: ignore, the ramp owns the register.
      # Output ON: run the soft-start so a raise WALKS up (and a drop buck-steps
      #   down) — never a direct jump to the device (that's what rebooted it).
      # Output OFF: just store the setpoint on the device; no output, no inrush.
      - if:
          condition:
            lambda: 'return !id(softstart_on).is_running();'
          then:
            - if:
                condition:
                  lambda: 'return id(sk_onoff).state;'
                then:
                  - script.execute: softstart_on
                else:
                  - number.set: {id: vset_dev, value: !lambda 'return id(v_target).state;'}

  # Actual REG_V_SET writer — hidden. Written by the ramp, engine, and the
  # apply-while-on path above. Write-mostly (reflect is the Device V_SET sensor).
  - platform: modbus_controller
    modbus_controller_id: sk120
    id: vset_dev
    internal: true
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    min_value: 0
    max_value: ${vset_max}
    step: 0.01
    multiply: 100
    skip_updates: 600

  - platform: modbus_controller
    modbus_controller_id: sk120
    name: "Set Current"      # REG_I_SET 0x01, stores A×1000
    id: set_current
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    unit_of_measurement: "A"
    mode: box                # free numeric input box (not slider)
    min_value: 0
    max_value: ${iset_max}
    step: 0.001
    multiply: 1000
    skip_updates: 1     # see Set Voltage

# ---- Lead-acid charge engine (carried from dps150 charge/engine.js) ---------
# Stages: IDLE -> CC (bulk) -> CV (absorb) -> FLOAT (hold). Runs on-device every
# 1s, independent of any web page. Output is enabled through the soft-start.
text_sensor:
  - platform: template
    name: "Charge Stage"
    id: charge_stage_text
    update_interval: 1s
    lambda: |-
      switch (id(cj_stage)) {
        case 1: return {"CC (bulk)"};
        case 2: return {"CV (absorb)"};
        case 3: return {"FLOAT"};
        case 4: return {"DONE"};
        case 5: return {"FAULT"};
        default: return {"IDLE"};
      }
  - platform: template
    name: "Charge Status"
    id: charge_status_text
    update_interval: 1s
    lambda: 'return id(cj_status);'

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(cj_booted) || !id(cj_run)) return;     // wait for boot policy; engine off

          const int   CELLS  = ${cells};
          const float CAP    = ${capacity_ah};
          const float VCLAMP = ${vset_max};
          const float ICLAMP = ${iset_max};
          const float OV_MARGIN = 1.03f, CV_EPS = 0.02f, NO_LOAD_A = 0.05f;
          const uint32_t NO_LOAD_MS = 3000, SETTLE_MS = 5000;

          // inputs
          float v = id(sk_vout).state;
          float i = id(sk_iout).state;
          float vin = id(sk_vin).state;
          float t = id(sk_temp_ext).state;
          bool  tvalid = !isnan(t) && t < 150.0f;        // 888.8 = unwired NTC sentinel
          bool  cv = id(sk_cv).state;
          uint32_t now = millis();

          // derived (temp-comp recomputed each tick)
          float tc = tvalid ? (${tempcomp_mv} / 1000.0f) * (t - 25.0f) : 0.0f;
          float absorbV = fminf((${absorb_v_cell} + tc) * CELLS, VCLAMP);
          float floatV  = fminf((${float_v_cell}  + tc) * CELLS, VCLAMP);
          float srcImax = (${source_max_w} * ${source_eff}) / absorbV;  // input budget -> I cap at worst-case V
          float chargeA = fminf(fminf((float) ${charge_a}, ICLAMP), srcImax);
          float taperA  = fminf(${taper_c} * CAP, chargeA * 0.2f);

          int stage = id(cj_stage);
          uint32_t stageEl = now - id(cj_stage_t0);
          uint32_t totEl   = now - id(cj_t0);
          float maxTotS = chargeA > 0 ? (CAP / chargeA) * 3600.0f * 1.5f : 0.0f;

          // per-tick guards while active (CC/CV/FLOAT)
          if (stage == 1 || stage == 2 || stage == 3) {
            const char* f = nullptr;
            if (tvalid && t > ${temp_max}) f = "hot abort";
            else if (v > absorbV * OV_MARGIN) f = "overvoltage";
            else if (stage == 1 && stageEl > NO_LOAD_MS && i < NO_LOAD_A) f = "no-load / open circuit";
            else if (stage != 3 && maxTotS > 0 && totEl / 1000.0f > maxTotS) f = "total time exceeded";
            if (f) {
              id(sk_onoff).turn_off(); id(softstart_on).stop();
              id(cj_stage) = 5; id(cj_status) = std::string(f);
              return;
            }
            // source under-voltage with dwell — debounce transient sag (compressor/charge-current dips)
            if (vin < ${src_min_v}) {
              if (id(cj_srclow_t0) < 0) id(cj_srclow_t0) = (int32_t) now;
              else if (now - (uint32_t) id(cj_srclow_t0) >= (uint32_t) (${src_low_dwell_s} * 1000)) {
                id(sk_onoff).turn_off(); id(softstart_on).stop();
                id(cj_stage) = 5; id(cj_status) = std::string("source depleted");
                return;
              }
            } else {
              id(cj_srclow_t0) = -1;
            }
          }

          switch (stage) {
            case 0: {   // IDLE -> start
              if (vin < ${src_min_v} || vin > ${src_max_v}) { id(cj_status) = std::string("source out of range"); break; }
              if (tvalid && t < ${temp_min}) { id(cj_status) = std::string("cold inhibit"); break; }
              if (tvalid && t > ${temp_max}) { id(cj_stage) = 5; id(cj_status) = std::string("hot at start"); break; }
              // pack-bounds only when terminal V is actually sensed (XY reads ~0 output-off)
              if (v > 0.5f) {
                float minV = 1.7f * CELLS, maxV = 2.6f * CELLS;
                if (v < minV || v > maxV)   { id(cj_stage) = 5; id(cj_status) = std::string("pack V out of range"); break; }
                if (v > absorbV * OV_MARGIN){ id(cj_stage) = 5; id(cj_status) = std::string("overvolt at start"); break; }
              }
              id(v_target).make_call().set_value(absorbV).perform();   // target for the ramp
              id(set_current).make_call().set_value(chargeA).perform();
              id(softstart_on).execute();                // ramp V_SET to absorb + enable output
              id(cj_t0) = now; id(cj_stage_t0) = now; id(cj_taper_t0) = -1; id(cj_srclow_t0) = -1;
              id(cj_stage) = 1; id(cj_status) = std::string("CC (bulk)");
              break;
            }
            case 1:     // CC bulk -> CV at absorb
              if (v >= absorbV - CV_EPS || cv) {
                id(cj_stage) = 2; id(cj_stage_t0) = now; id(cj_taper_t0) = -1;
                id(cj_status) = std::string("CV (absorb)");
              }
              break;
            case 2:     // CV absorb -> FLOAT when current tapers for the dwell
              if (i < taperA) {
                if (id(cj_taper_t0) < 0) id(cj_taper_t0) = (int32_t) now;
                else if (now - (uint32_t) id(cj_taper_t0) >= SETTLE_MS) {
                  id(v_target).make_call().set_value(floatV).perform();    // lowering — write device directly, no ramp
                  id(vset_dev).make_call().set_value(floatV).perform();
                  id(cj_stage) = 3; id(cj_stage_t0) = now; id(cj_taper_t0) = -1;
                  id(cj_status) = std::string("FLOAT");
                }
              } else {
                id(cj_taper_t0) = -1;
              }
              break;
            case 3:     // FLOAT: hold indefinitely (lead-acid maintenance)
            default:
              break;
          }
